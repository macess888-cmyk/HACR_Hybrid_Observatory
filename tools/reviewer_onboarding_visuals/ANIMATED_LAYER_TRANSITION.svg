<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">

  <rect width="1200" height="520" fill="#ffffff"/>

  <text x="40" y="45" font-family="Arial" font-size="30" font-weight="bold">
    Animated Layer Transition
  </text>

  <text x="40" y="80" font-family="Arial" font-size="16">
    Survival of an earlier layer does not prove survival of a later layer.
  </text>

  <!-- observable -->
  <rect x="60" y="180" width="150" height="90" rx="12" fill="#dff5df" stroke="#2c662d" stroke-width="2">
    <animate attributeName="opacity" values="1;1;1;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- inspectable -->
  <rect x="250" y="180" width="150" height="90" rx="12" fill="#dff5df" stroke="#2c662d" stroke-width="2">
    <animate attributeName="opacity" values="1;1;0.7;0.5" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- traversable -->
  <rect x="440" y="180" width="150" height="90" rx="12" fill="#fff1c7" stroke="#8a6d00" stroke-width="2">
    <animate attributeName="opacity" values="1;0.7;0.4;0.2" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- interruptible -->
  <rect x="630" y="180" width="150" height="90" rx="12" fill="#f7dddd" stroke="#7a1f1f" stroke-width="2">
    <animate attributeName="opacity" values="1;0.5;0.2;0.05" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- recoverable -->
  <rect x="820" y="180" width="150" height="90" rx="12" fill="#d8d8d8" stroke="#555555" stroke-width="2">
    <animate attributeName="opacity" values="1;0.2;0.05;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text x="85" y="230" font-family="Arial" font-size="16">observable</text>
  <text x="265" y="230" font-family="Arial" font-size="16">inspectable</text>
  <text x="455" y="230" font-family="Arial" font-size="16">traversable</text>
  <text x="645" y="230" font-family="Arial" font-size="16">interruptible</text>
  <text x="840" y="230" font-family="Arial" font-size="16">recoverable</text>

  <text x="60" y="370" font-family="Arial" font-size="22" font-weight="bold">
    observable ≠ inspectable ≠ traversable ≠ interruptible ≠ recoverable
  </text>

  <text x="60" y="430" font-family="Arial" font-size="16">
    Observer-only • Not authority • UNKNOWN -> HOLD
  </text>

</svg>